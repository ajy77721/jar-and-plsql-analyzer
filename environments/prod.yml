# =============================================================================
# amp-analyzer — Kanopy Helm values (production)
# Chart: mongodb/web-app (4.35.0)
# Namespace: amp-delivery
# Ingress host: amp-analyzer.amp-delivery.prod.corp.mongodb.com
#
# Single-container app, no sidecars: the Spring Boot unified-web jar serves the
# UI/API itself and writes every artifact to S3 (app.storage.mode=s3 is the
# default), so the pod is stateless and needs no bundled datastore.
# image.tag (the git tag) and image.repository are set by .drone.yml deploy-prod,
# which runs on tag events only.
# =============================================================================

replicaCount: 1

# -- Image -------------------------------------------------------------------
image:
  repository: ghcr.io/modernization-factory/amp-analyzer
  pullPolicy: IfNotPresent

# -- Services ----------------------------------------------------------------
services:
  - name: http
    ingress: true
    probes: true
    port: 80
    targetPort: 8083
    protocol: TCP
    type: ClusterIP

# -- Ingress -----------------------------------------------------------------
ingress:
  enabled: true
  hosts:
    - amp-analyzer.amp-delivery.prod.corp.mongodb.com

# -- Container environment ---------------------------------------------------
env:
  PORT: "8083"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
  # AWS_REGION is required for the S3 storage backend (all artifacts live in S3):
  #   AWS_REGION: ap-south-1

envSecrets:
  # AWS credentials reach the app via the SDK default provider chain. Prefer a
  # pod IAM role (no entry needed here); otherwise create an S3-scoped secret
  # store entry and reference it, e.g.:
  # aws-creds: <name-of-secret-store-entry>

# -- Health probes -----------------------------------------------------------
probes:
  enabled: true
  liveness:
    path: /
  readiness:
    path: /

# -- Resources ---------------------------------------------------------------
resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "4"
    memory: 12Gi
