# =============================================================================
# amp-analyzer — Kanopy Helm values (staging)
# Chart: mongodb/web-app (4.35.0)
# Namespace: amp-delivery
# Ingress host: amp-analyzer.amp-delivery.staging.corp.mongodb.com
#
# Single-container app, no sidecars: the Spring Boot unified-web jar serves the
# UI/API itself and writes every artifact to S3 (app.storage.mode=s3 is the
# default), so the pod is stateless and needs no bundled datastore.
# image.tag (git-<sha>) and image.repository are set by .drone.yml deploy-staging.
# =============================================================================

replicaCount: 1

# -- Image -------------------------------------------------------------------
image:
  repository: ghcr.io/modernization-factory/amp-analyzer
  pullSecret: ghcr-secret
  pullPolicy: IfNotPresent

# -- Services ----------------------------------------------------------------
# One service carries both ingress and probes; one containerPort per entry.
services:
  - name: http
    ingress: true
    probes: true
    port: 80
    targetPort: 8083
    protocol: TCP
    type: ClusterIP

# -- Ingress -----------------------------------------------------------------
# Mesh-only namespace (Gatekeeper: [ingress-mesh-only]) — the chart must wire
# traffic through the service mesh, matching the amp-context-beta pattern.
mesh:
  enabled: true
  permissive: false

ingress:
  enabled: true
  hosts:
    - amp-analyzer.amp-delivery.staging.corp.mongodb.com

# -- Container environment ---------------------------------------------------
env:
  PORT: "8083"
  # Container JVM sizing: 75% of the pod memory limit (see resources below)
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
  # AWS_REGION is required for the S3 storage backend (all artifacts live in S3):
  #   AWS_REGION: ap-south-1

envSecrets: {}
probes:
  enabled: true
  liveness:
    path: /
  readiness:
    path: /

# -- Resources ---------------------------------------------------------------
resources:
  requests:
    cpu: "1"
    memory: 6Gi
  limits:
    cpu: "2"
    memory: 10Gi
