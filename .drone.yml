---
kind: pipeline
type: kubernetes
name: default

# Modeled on the devprod-urp working pipeline (same Drone/Kanopy infra):
#   test -> publish image to GHCR -> drone-helm:v3 deploy to Kanopy
# staging deploys on every push to main; prod on version tags.

steps:
- name: build+publish-main-branch
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - git-${DRONE_COMMIT_SHA:0:7}
    - latest
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    branch:
    - main
    event:
    - push

- name: build+publish-tag
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - ${DRONE_TAG}
    - git-${DRONE_COMMIT_SHA:0:7}
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    event:
    - tag

- name: deploy-staging
  pull: if-not-exists
  image: quay.io/mongodb/drone-helm:v3
  settings:
    namespace: amp-delivery
    release: amp-analyzer
    tiller_ns: amp-delivery
    api_server: https://api.staging.corp.mongodb.com
    add_repos:
    - mongodb=https://10gen.github.io/helm-charts
    chart: mongodb/web-app
    chart_version: 4.31.0
    kubernetes_token:
      from_secret: staging_kubernetes_token
    prefix: staging
    values_files:
    - ./environments/staging.yml
    string_values:
    - image.tag=git-${DRONE_COMMIT_SHA:0:7}
    - image.repository=ghcr.io/modernization-factory/amp-analyzer
    wait_for_upgrade: true
  when:
    branch:
    - main
    event:
    - push

- name: deploy-prod
  pull: if-not-exists
  image: quay.io/mongodb/drone-helm:v3
  settings:
    namespace: amp-delivery
    release: amp-analyzer
    tiller_ns: amp-delivery
    api_server: https://api.prod.corp.mongodb.com
    add_repos:
    - mongodb=https://10gen.github.io/helm-charts
    chart: mongodb/web-app
    chart_version: 4.31.0
    kubernetes_token:
      from_secret: prod_kubernetes_token
    prefix: prod
    values_files:
    - ./environments/prod.yml
    string_values:
    - image.tag=${DRONE_TAG}
    - image.repository=ghcr.io/modernization-factory/amp-analyzer
    wait_for_upgrade: true
  when:
    event:
    - tag
