---
kind: pipeline
type: kubernetes
name: default

platform:
  os: linux

# Modeled on the amp-platform deploy pattern:
#   build -> publish image to GHCR -> Helm deploy to Kanopy (staging on push, prod on tag)

steps:
# Testcases disabled for now — this step only verifies the code compiles.
# To re-enable: change the command to `mvn -B -no-transfer-progress test`
- name: test
  pull: if-not-exists
  image: maven:3.9-eclipse-temurin-17
  commands:
  - mvn -B -no-transfer-progress package -DskipTests -q

- name: slack-start
  pull: if-not-exists
  failure: ignore
  image: plugins/slack
  settings:
    channel: amp-analyzer
    template: "*Staging*: building (<{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}>) by {{build.author}} from `{{build.branch}}`\n"
  environment:
    SLACK_WEBHOOK:
      from_secret: slack_webhook
  when:
    branch:
    - main
    event:
    - push
    status:
    - success
    - failure

- name: build+publish-main-branch
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - git-${DRONE_COMMIT_SHA:0:7}
    - latest
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    branch:
    - main
    event:
    - push

- name: build+publish-tag
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - ${DRONE_TAG}
    - git-${DRONE_COMMIT_SHA:0:7}
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    event:
    - tag

- name: deploy-staging
  pull: if-not-exists
  image: quay.io/mongodb/drone-helm:v2
  settings:
    chart: mongodb/web-app
    chart_version: 4.35.0   # matches the amp-platform chart pin
    client_only: true
    helm_repos: mongodb=https://10gen.github.io/helm-charts
    namespace: amp-delivery
    prefix: staging
    release: amp-analyzer
    tiller_ns: amp-delivery
    values: image.tag=git-${DRONE_COMMIT_SHA:0:7},image.repository=ghcr.io/modernization-factory/amp-analyzer
    values_files:
    - ./environments/staging.yml
  environment:
    API_SERVER: https://api.staging.corp.mongodb.com
    STAGING_KUBERNETES_TOKEN:
      from_secret: staging_kubernetes_token
  when:
    branch:
    - main
    event:
    - push

- name: deploy-prod
  pull: if-not-exists
  image: quay.io/mongodb/drone-helm:v2
  settings:
    chart: mongodb/web-app
    chart_version: 4.35.0   # matches the amp-platform chart pin
    client_only: true
    helm_repos: mongodb=https://10gen.github.io/helm-charts
    namespace: amp-delivery
    prefix: prod
    release: amp-analyzer
    tiller_ns: amp-delivery
    values: image.tag=${DRONE_TAG},image.repository=ghcr.io/modernization-factory/amp-analyzer
    values_files:
    - ./environments/prod.yml
  environment:
    API_SERVER: https://api.prod.corp.mongodb.com
    PROD_KUBERNETES_TOKEN:
      from_secret: prod_kubernetes_token
  when:
    event:
    - tag

- name: slack-finish
  pull: if-not-exists
  failure: ignore
  image: plugins/slack
  settings:
    channel: amp-analyzer
    template: "{{#success build.status}}\n  ✅ <{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}> deployed in {{since build.started}}\n{{else}}\n  ❌ <{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}> failed {{build.link}}\n{{/success}}\n"
  environment:
    SLACK_WEBHOOK:
      from_secret: slack_webhook
  when:
    status:
    - success
    - failure

...
