---
kind: pipeline
type: kubernetes
name: default

platform:
  os: linux

# Modeled on the amp-platform deploy pattern:
#   build -> publish image to GHCR -> Helm deploy to Kanopy (staging on push, prod on tag)

steps:
# Testcases disabled for now — this step only verifies the code compiles.
# To re-enable: change the command to `mvn -B -no-transfer-progress test`
- name: test
  pull: if-not-exists
  image: maven:3.9-eclipse-temurin-17
  commands:
  - mvn -B -no-transfer-progress package -DskipTests -q

- name: slack-start
  pull: if-not-exists
  failure: ignore
  image: plugins/slack
  settings:
    channel: amp-analyzer
    template: "*Staging*: building (<{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}>) by {{build.author}} from `{{build.branch}}`\n"
  environment:
    SLACK_WEBHOOK:
      from_secret: slack_webhook
  when:
    branch:
    - main
    event:
    - push
    status:
    - success
    - failure

- name: build+publish-main-branch
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - git-${DRONE_COMMIT_SHA:0:7}
    - latest
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    branch:
    - main
    event:
    - push

- name: build+publish-tag
  pull: if-not-exists
  image: plugins/docker
  settings:
    registry: ghcr.io
    repo: ghcr.io/modernization-factory/amp-analyzer
    tags:
    - ${DRONE_TAG}
    - git-${DRONE_COMMIT_SHA:0:7}
    username:
      from_secret: ghcr_user
    password:
      from_secret: ghcr_token
  when:
    event:
    - tag

- name: deploy-staging
  pull: if-not-exists
  image: alpine/k8s:1.30.4
  commands:
  - echo "staging token length: $${#STAGING_KUBERNETES_TOKEN}"
  - kubectl config set-cluster staging --server=https://api.staging.corp.mongodb.com
  - kubectl config set-credentials deployer --token="$(printf "%s" "$${STAGING_KUBERNETES_TOKEN}" | tr -d "[:space:]")" </dev/null
  - kubectl config set-context staging --cluster=staging --user=deployer --namespace=amp-delivery
  - kubectl config use-context staging
  - kubectl auth can-i list pods -n amp-delivery </dev/null
  - timeout 120 helm repo add mongodb https://10gen.github.io/helm-charts || true
  - helm upgrade --install amp-analyzer mongodb/web-app --namespace amp-delivery --version 4.35.0 -f ./environments/staging.yml --set image.repository=ghcr.io/modernization-factory/amp-analyzer --set image.tag=git-${DRONE_COMMIT_SHA:0:7} --wait --timeout 10m0s
  when:
    branch:
    - main
    event:
    - push

- name: deploy-prod
  pull: if-not-exists
  image: alpine/k8s:1.30.4
  commands:
  - echo "prod token length: $${#PROD_KUBERNETES_TOKEN}"
  - kubectl config set-cluster prod --server=https://api.prod.corp.mongodb.com
  - kubectl config set-credentials deployer --token="$(printf "%s" "$${PROD_KUBERNETES_TOKEN}" | tr -d "[:space:]")" </dev/null
  - kubectl config set-context prod --cluster=prod --user=deployer --namespace=amp-delivery
  - kubectl config use-context prod
  - kubectl auth can-i list pods -n amp-delivery </dev/null
  - timeout 120 helm repo add mongodb https://10gen.github.io/helm-charts || true
  - helm upgrade --install amp-analyzer mongodb/web-app --namespace amp-delivery --version 4.35.0 -f ./environments/prod.yml --set image.repository=ghcr.io/modernization-factory/amp-analyzer --set image.tag=${DRONE_TAG} --wait --timeout 10m0s
  when:
    event:
    - tag

- name: slack-finish
  pull: if-not-exists
  failure: ignore
  image: plugins/slack
  settings:
    channel: amp-analyzer
    template: "{{#success build.status}}\n  ✅ <{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}> deployed in {{since build.started}}\n{{else}}\n  ❌ <{{build.link}}|${DRONE_REPO}#{{truncate build.commit 8}}> failed {{build.link}}\n{{/success}}\n"
  environment:
    SLACK_WEBHOOK:
      from_secret: slack_webhook
  when:
    status:
    - success
    - failure

...
