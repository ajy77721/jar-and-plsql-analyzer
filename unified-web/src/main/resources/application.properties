server.port=8093
spring.application.name=unified-analyzer

# ── Static resources: content-versioned URLs (never a stale JS/CSS after a deploy) ──
# The pages are plain HTML with hardcoded <script src>/<link href> tags, so Spring's content
# strategy below cannot version them (it only rewrites ResourceUrlProvider URLs). PageHtmlTransformer
# rewrites those tags at request time with ?v=<content-hash> from StaticResourceVersionIndex, so a
# deploy that changes a file changes its URL and the browser is forced to fetch the new bytes.
#
# Cache-Control is owned entirely by PageHtmlTransformer, NOT by spring.web.resources.cache.*: those
# properties are global and would also cache the runtime-fetched JSON configs (jar/domain-config.json)
# forever, which must revalidate. Per request the filter sets:
#   .js/.css with the current ?v=<hash>  -> public, max-age=31536000, immutable (safe: URL changes
#                                            whenever the content does)
#   .js/.css without it (direct / old)   -> no-cache, must-revalidate
#   HTML entry pages                     -> no-store (their own validators do not change when a
#                                            referenced JS/CSS changes, so a 304 would keep a stale ?v=)
#   other static files (JSON, icons, …)  -> no-cache, must-revalidate
# The content strategy is the built-in counterpart for any future ResourceUrlProvider-based template.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ══════════════════════════════════════════════════════════════
# Single runtime directory — ALL mutable state lives under app.data-dir:
#   java -jar app.jar --app.data-dir=/srv/analyzer/data
#
# Layout (created/seeded from the jar on first boot):
#   {data}/config/  plsql-config.yaml (connections), domain-config.json, prompts/*.txt
#   {data}/plsql/   {data}/jar/   {data}/plsql-parse/   analysis state
#   {data}/cache/   schema-resolver cache
#   {data}/logs/    application logs
# The config dir, parser-config-path and LOG_PATH are all derived from this base by
# DirPropertyResolver, so relocating the product = pointing app.data-dir at one folder.
# ══════════════════════════════════════════════════════════════
app.data-dir=data

# ══════════════════════════════════════════════════════════════
# JAR Analyzer settings
# ══════════════════════════════════════════════════════════════

spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB
spring.jackson.serialization.indent-output=false
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024
spring.mvc.async.request-timeout=-1

# Claude CLI analysis config
claude.analysis.max-endpoints=-1
claude.analysis.parallel-chunks=5

# Cross-reference Claude enrichment
claude.crossref.parallel-chunks=3
claude.crossref.max-source-lines=150
claude.allowed-tools=Read,Grep,Glob,Bash,Write,Edit

# Call tree building limits — 0 means UNLIMITED (the default).
# The crawler walks every reachable method to full depth. Truncating produced a call tree that
# silently under-reported collections and operations: a wrong answer indistinguishable from a
# right one. Termination does not rely on these caps — cycles are cut by back-edge detection and
# repeated subtrees by memoization in CallTreeBuilder.
# Set a positive value only to deliberately bound a pathological JAR; expect missing data if you do.
calltree.max-depth=0
calltree.max-children-per-node=0
calltree.max-nodes-per-tree=0
calltree.max-invocations-per-method=0

# Decompile cache: per-class decompiled-source artifacts (jar/<id>/decompiled/<className>.java)
# self-expire after this many hours so a jar re-upload or a bad decompile eventually self-heals
# without manual cache invalidation. Applies identically in every app.storage.mode (local/s3/
# mongodb) — see DecompilerService.cacheTtlMillis javadoc. 0 disables expiry (cache forever).
app.jar.decompile-cache.ttl-hours=48

# Chunking / prompt size limits
claude.chunking.max-chunk-chars=50000
claude.chunking.max-tree-nodes=500
claude.chunking.max-chunk-depth=3
claude.chunking.max-prompt-chars=180000

# Timeout configuration (seconds)
claude.timeout.per-endpoint=7200
claude.timeout.version-check=30
claude.timeout.stream-drain=3000
claude.timeout.executor-shutdown=60
mongo.timeout.connect=30
mongo.timeout.server-selection=30

# ══════════════════════════════════════════════════════════════
# PL/SQL Analyzer settings
# ══════════════════════════════════════════════════════════════

# Applies to ALL multipart uploads (JAR analyzer included, not just PL/SQL) — Tomcat's own
# connector-level cap sits in front of spring.servlet.multipart.max-*, so it must be raised too or
# it rejects the request before Spring's multipart limits are ever consulted. Raised from 50MB
# (2026-09-11) after a real 3GB+ JAR upload was found to be rejected at this layer.
server.tomcat.max-http-form-post-size=5GB

# Disable auto DataSource and MongoDB (both managed manually on-demand)
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

plsql.threads.source-fetch=8
plsql.threads.trigger-resolve=4
plsql.threads.metadata=4
plsql.threads.claude-parallel=5
# 0 = unlimited, as with calltree.* above — a truncated PL/SQL graph under-reports reached tables.
plsql.tree.max-depth=0
plsql.tree.max-nodes=0

# PL/SQL Parser config path (for flow analysis DB connection).
# Overridden at startup by DirPropertyResolver to {data}/config/plsql-config.yaml;
# this default only applies if DirPropertyResolver is not active.
app.parser-config-path=config/plsql-config.yaml

# ── W3 DB-impact safety (the analyzed database must never suffer) ──────────────
# Catalog/source query QPS cap (token bucket). Lower it for a fragile/hostile DB;
# 0 or negative disables the limiter. Default 20.
app.crawl.db.qps=20
# Per-statement JDBC queryTimeout in seconds (applied to every crawl catalog/source
# query). Default 300 (5 minutes) — heavy batched catalog queries on real customer
# databases (large schemas, remote links) can legitimately run minutes; the timeout
# exists so a hung DB fails the crawl instead of hanging it, not to rush real work.
app.crawl.db.timeout-seconds=300
# Consecutive query failures that abort the crawl ("the database is not responding —
# aborting to protect it") instead of hanging/retrying for minutes. 0 disables.
app.crawl.db.circuit-breaker-threshold=5

# ══════════════════════════════════════════════════════════════
# Claude CLI authentication
# By default uses local `claude login` credentials (no env vars needed).
# To use AWS Bedrock: set claude.bedrock.enabled=true and configure profile/region.
# ══════════════════════════════════════════════════════════════
claude.bedrock.enabled=false
claude.bedrock.profile=ClaudeCode
claude.bedrock.region=eu-central-1

# ══════════════════════════════════════════════════════════════
# Chat configuration
# chat.classic.enabled — enable/disable the Classic (session-based) chat panel
# chat.chatbox.enabled — enable/disable the new floating AI chatbox (JAR-specific)
# Both can be enabled simultaneously; user toggles between them on the JAR page.
# ══════════════════════════════════════════════════════════════
chat.classic.enabled=true
chat.chatbox.enabled=true

# ══════════════════════════════════════════════════════════════
# Static resource caching — owned by PageHtmlTransformer (see the top of this file). The
# spring.web.resources.cache.* properties are deliberately NOT set: they are global, so they cannot
# give versioned JS/CSS a long immutable cache while keeping the JSON configs revalidating.
# ══════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════
# Tomcat tuning — limit idle threads to reduce memory footprint
# ══════════════════════════════════════════════════════════════
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=4
server.tomcat.connection-timeout=60s

# ══════════════════════════════════════════════════════════════
# Logging
# ══════════════════════════════════════════════════════════════

logging.file.name=logs/unified-analyzer.log
logging.level.com.plsql.parser.flow=INFO
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=1
logging.logback.rollingpolicy.file-name-pattern=logs/unified-analyzer.%d{yyyy-MM-dd}.%i.log.gz

# Log archiving DISABLED (2026-09-29 decision): rotation alone bounds logs — the current
# file is active and a rolled file is deleted per logback max-history, with NO upload to the
# artifact store. LogArchiveService's @ConditionalOnProperty removes the bean entirely.
app.logs.archive.enabled=false
app.logs.archive.interval-ms=60000
# Retention for logs already shipped to the store. Local rolled files are bounded by logback
# (max-history / total-size-cap below), but archived copies were never removed and grew for the life
# of the deployment. retain-min is a floor kept regardless of age, so a quiet fortnight cannot empty
# the archive. Set retain-days=0 to keep everything.
app.logs.archive.retain-days=14
app.logs.archive.retain-min=5
logging.logback.rollingpolicy.total-size-cap=10MB
logging.logback.rollingpolicy.clean-history-on-start=true

# ── API latency budget (SLO) ──────────────────────────────────────────
# ApiLoggingFilter already logs every /api/ call's duration; this is the budget that turns a slow
# one into a distinct [SLO] WARN. An endpoint+status over budget warns at most once per hour (so a
# sustained violation does not flood the log), and every over-budget request counts toward an
# hourly [SLO] summary line. Set 0 to disable the per-call warning.
app.api.slo.ms=200

# ── Eager sidecar warm-up ─────────────────────────────────────────────────
# Precompute every analysis's <analysis>/views/ summaries in the background (at startup and then
# every interval-hours) so the first visitor of a detail view does not pay the lazy backfill —
# measured at 35-41s cold for a ~116-node analysis. Skipped for analyses whose view set is already
# complete. On a pod with no ambient AWS credentials the boot/periodic sweep cannot reach the store
# and logs one line per sweep, retrying next time; the analysis-completion hook warms a brand-new
# analysis on-thread with its submitter's credentials, and `on-login` warms the whole corpus once
# with the first logged-in user's own captured credentials. Set enabled=false to turn the sweep off.
app.sidecar.warmup.enabled=true
app.sidecar.warmup.interval-hours=6
# Warm with the FIRST logged-in user's own credentials: on a completed login the sweep runs once,
# bound to that session's role credentials (the pod itself has none). Later logins do not re-sweep
# until interval-hours has passed, and the trigger is async so a login is never blocked. Set false
# to keep only the boot/periodic sweep.
app.sidecar.warmup.on-login=true
# Also warm the JAR decompile cache in the same sweep (each class costs CFR 8-21s on a cold first
# click). Per jar, at most this many of the analysis's top classes are decompiled, within a wall-
# clock budget; already-cached classes are skipped. Best-effort: it can never fail the sweep.
app.sidecar.warmup.decompile=true
app.sidecar.warmup.decompile-max-classes-per-jar=50
app.sidecar.warmup.decompile-budget-seconds-per-jar=60

# ── Storage backend ───────────────────────────────────────────────────
# local   = files on disk under app.data-dir.base (default; today's behaviour)
# s3      = objects under s3://{bucket}/{prefix}/ — same layout, same file names
# mongodb = documents in MongoDB, GridFS above the inline threshold — same layout again
# hybrid  = both at once: small artifacts in MongoDB, big ones in S3 (see below)
#
# Only the medium differs: data/jar/<id>/analysis.json becomes
# s3://amp-analyzer/data/jar/<id>/analysis.json, or the document
# _id "data/jar/<id>/analysis.json". The UI cannot tell which is active.
#app.storage.mode=local

# Per-feature overrides. The PL/SQL parser and the JAR analyzer are independent features that
# happen to share the app.storage.mode default above; either can be pointed at a different backend
# without touching the other. Both are optional and both fall back to app.storage.mode when unset,
# so a deployment that never sets these two keeps behaving exactly as before — one property, one
# effective backend, for both features.
#app.storage.parser.mode=local
#app.storage.jar.mode=local

# s3 mode only. Credentials come from the DefaultCredentialsProvider chain
# (env / SSO profile / instance role) and are never read from this file.
app.storage.s3.bucket=amp-analyzer-parse-jar
app.storage.s3.region=ap-south-1
# Region of the IAM Identity Center instance (sso_region in ~/.aws/config) — the ssooidc
# device-flow endpoint must live in THIS region, not the S3 bucket's region, or
# StartDeviceAuthorization rejects the portal URL with InvalidClientMetadataException.
app.storage.sso.region=us-east-1
# Identity Center portal URL prefilled into the login modal (so deployed users don't type it).
app.storage.sso.start-url=https://d-9067613a84.awsapps.com/start/#
# Pin the AWS account (and optionally the role) the automatic pick lands on, so an ordinary user
# with a single account connects to the bucket-owning account with ZERO clicks instead of landing
# on an arbitrary first account. Set e.g.:
#   app.storage.sso.account-id=331472312345
#   app.storage.sso.role-name=Services.User
# Applies only when the user's login actually exposes that account; otherwise it is ignored and the
# user gets the chooser (a mis-set value can never fail a login). A per-login request from /start
# still overrides it, and a user with more than one account always sees the chooser, pre-selected on
# this value, to confirm or change. Empty = today's "first account" behaviour.
app.storage.sso.account-id=
app.storage.sso.role-name=
app.storage.s3.prefix=data

# ── Admin portal ──
# Legacy static admin key. It is no longer a credential: /admin-portal/ signs in with the operator
# credentials below and the server mints a random, 12-hour session token that the page sends back as
# the X-Admin-Key header. Kept commented for reference; setting it changes nothing.
#app.admin.api-key=
# Operator credentials for /admin-portal/ (POST /api/admin/login). The defaults make a local run
# usable out of the box — CHANGE BOTH IN PRODUCTION. Neither value is ever logged or returned; a
# wrong pair yields the same 403 as a wrong user or a wrong password.
app.admin.username=amp-admin
app.admin.password=amp-admin-pwd

# mongodb mode, and/or app.storage.repository=mongo below. Both share one connection pool.
#
# There is deliberately no username/password property: authentication belongs in the URI, from
# the operator's own secret store, and the URI is redacted before it reaches a log. Same rule as
# S3 above — no secret in a file this application writes or serves.
#
# prefix defaults to `data`, matching app.storage.s3.prefix, because the manifest _id IS the S3
# key string. Identical prefixes mean flipping modes needs no key rewriting, which is what makes
# a rollback a property change rather than a migration.
#
# inline-threshold: artifacts at or below this many bytes live in the manifest document; larger
# ones go to GridFS. Default 1 MiB, hard ceiling 8 MiB (below the 12 MB entity-document soft
# limit, so the two guards cannot disagree). 0 means "use the default".
#app.storage.mongodb.uri=mongodb://localhost:27017
#app.storage.mongodb.database=analyzer
#app.storage.mongodb.prefix=data
#app.storage.mongodb.inline-threshold=0

# hybrid mode. Reads BOTH the app.storage.s3.* block above and the app.storage.mongodb.* block
# above at once — same bucket/region/endpoint, same uri/database/prefix/inline-threshold — plus
# one extra property for the split between them:
#
# big-threshold: artifacts at or above this many bytes go straight to S3, skipping MongoDB
# entirely; smaller ones are written through MongoArtifactStore's own write path (which may still
# promote an individual artifact to GridFS internally, per inline-threshold above — that split is
# unrelated to this one). A write that starts under the threshold and crosses it mid-stream rolls
# over into S3 without ever landing in Mongo. Default 1 MiB, same default as inline-threshold
# above, but the two thresholds are independent and may be set differently. 0 means "use the
# default". Reads/exists/size try MongoDB first (most artifacts are small) and fall back to S3.
#app.storage.hybrid.big-threshold=0

# ── Entity ingest ("mode 4") ────────────────────────────────────────────
# Off by default — no behaviour change unless explicitly enabled. When on, every PL/SQL analyze
# also populates the am_* entity collections in-process, best-effort, right after the primary
# artifact write succeeds (EntityIngestTrigger). A failure here is logged, never fails the analysis.
#
# Entities are Mongo-only regardless of app.storage.mode above: with mode=mongodb and no separate
# URI given here, this reuses app.storage.mongodb.uri/database; with mode=local/s3, an explicit
# URI/database below is required — the app fails to start otherwise, per PLAN-09 §8 R1's own
# "surface a storage misconfiguration at boot" rule, not on the first analysis.
# DEFAULT SETUP: S3 bucket ONLY — no MongoDB dependency. Every artifact (sources, chunks,
# analysis JSONs, uploaded JARs, chat sessions) lives in s3://amp-analyzer-parse-jar and is read
# back from there; the UI detail readers fall back to scanning those artifacts when the am_*
# collections are absent. Re-enable entity-ingest (and set its mongo.uri/.database below) only
# if the faster am_*-backed detail pages are wanted again — it is a derived, regenerable index.
app.storage.entity-ingest.enabled=false
#app.storage.entity-ingest.mongo.uri=mongodb://localhost:27017
#app.storage.entity-ingest.mongo.database=amp-parse
#app.storage.entity-ingest.mongo.uri=mongodb://localhost:27017
#app.storage.entity-ingest.mongo.database=analyzer

# ── Query repository ──────────────────────────────────────────────────
# Which implementation answers the paged list queries (AnalysisRepository).
#   artifact-scan = read today's JSON artifacts through the store (default; works in every mode)
#   mongo         = answer from MongoDB indexes (PLAN-09 Increment D). Needs app.storage.mongodb.*
#                   above; an unreachable server fails at startup, not on the first query.
#
# Separate from app.storage.mode because they are two capabilities, not one: the store holds
# opaque bytes, the repository answers queries. Keeping them apart is what makes the rollout
# reversible — Increment F runs mode=s3 with repository=mongo, so writes still land in the
# bucket and rolling back is this one line rather than a restore.
app.storage.repository=artifact-scan

app.storage.mode=s3

# -- Authentication (mode-aware) ---------------------------------------
# app.auth.required: true|false. When UNSET it is auto-derived from the effective storage mode(s):
#   s3/hybrid     -> true  (SSO page-lock; per-user buckets)
#   local/mongodb -> false (nothing user-scoped to protect - every /api/** is open with no cookie)
# An explicit value always wins. The legacy app.auth.sso.required is still honoured when
# app.auth.required is unset. The AWS SSO endpoints (/api/auth/aws/**) stay reachable in every
# mode, so an optional login is always possible. See docs/modes.md.
#app.auth.required=true

app.storage.mongodb.prefix=amp-analyzer/data
app.storage.mongodb.database=amp-parse

app.storage.hybrid.big-threshold=1048576

# Path-based S3 routing (hybrid mode): keys carrying any of these path segments are written to S3
# regardless of size. `sources` = the parser's raw SQL source files — the actual source belongs in
# S3, while the small detail artifacts stay in Mongo (and the am_* collections via entity-ingest).
app.storage.hybrid.s3-always-paths=sources

# Parallel small-write uploads for S3 mode: small artifacts buffer on close and upload on a
# bounded 8-thread pool instead of one serialized remote round trip each. Read semantics are
# unchanged (reads/listings drain pending uploads first — WriteBehindStore).
app.storage.s3.write-behind=true

# ── Disk read-through cache ───────────────────────────────────────
# Wraps BOTH routed artifact stores (parser + jar). A read that misses fetches from the configured
# store (S3/Mongo/local) and mirrors the bytes to {app.data-dir}/cache/store/, so a repeated read is
# a local file open instead of a network round trip. Writes/deletes always go to the store first,
# then invalidate the cached entry, its subtree, and its parent listings, so a correction/re-upload/
# delete is fresh at once. A cached entry older than 24h is revalidated with one cheap
# size/last-modified probe.
app.cache.disk.enabled=true
# LRU-by-last-access cap. Trimmed opportunistically on a background thread; never blocks a read.
# 0 or negative disables trimming (unbounded). Clear it with `amp-ops.sh clear-cache` or
# POST /api/admin/cache/clear (admin portal: "Clear cache").
app.cache.disk.max-mb=2048
# Heap micro-cache: a SMALL in-heap LRU above the disk layer, for READ artifacts <= 256 KB each.
# Serves a hot sidecar/index from memory (~sub-ms) with no disk open. Strictly capped, so a
# multi-GB JAR can never enter it — an artifact over 256 KB is streamed from disk and never copied.
# Populated lazily from what is actually read (no preload); invalidated by the same writes/deletes
# as the disk layer; entries age out on the disk layer's 24h revalidation window. 0 disables it.
app.cache.heap.max-mb=64

# ── Session hardening ─────────────────────────────────────────────
# All traffic arrives over TLS (Kanopy ingress terminates https for *.corp.mongodb.com),
# so the session cookie can always be Secure + HttpOnly. 12h session lifetime matches
# the SSO registry's idle TTL rhythm.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=12h

# ── Deployment region (for the /api/meta/deployment self-awareness endpoint) ──
# The AWS region the Kanopy cluster runs in — visible in the Kanopy console for the cluster.
# Leave empty to show "unknown" + live latency measurement only.
app.deployment.region=ap-south-1
