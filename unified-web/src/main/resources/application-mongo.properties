# ─────────────────────────────────────────────────────────────────────────────
# MongoDB storage profile.
#
#   mvn -pl unified-web spring-boot:run -Dspring-boot.run.profiles=mongo
#   java -jar unified-web/target/unified-web-1.0.0-SNAPSHOT.jar --spring.profiles.active=mongo
#
# Everything the app writes goes to MongoDB instead of the local filesystem. The layout is
# identical — data/jar/<id>/analysis.json becomes the document _id "data/jar/<id>/analysis.json" —
# so the UI cannot tell which backend is active, and switching back is one flag.
#
# NO CREDENTIALS IN THIS FILE. Authentication belongs in the URI, from your own secret store:
#   --app.storage.mongodb.uri="mongodb://user:pass@host:27017/?authSource=admin"
# The URI is redacted before it reaches a log. The default below is a local unauthenticated
# server, which is what a development box runs.
# ─────────────────────────────────────────────────────────────────────────────

app.storage.mode=mongodb
app.storage.mongodb.uri=mongodb://localhost:27017
app.storage.mongodb.database=amp-analyzer
app.storage.mongodb.prefix=data

# Artifacts at or below this size live inline in the manifest document; larger ones go to GridFS.
# 1 MiB, which is the default — stated explicitly here so the value is visible while testing
# rather than hidden in a default. Hard ceiling is 8 MiB.
app.storage.mongodb.inline-threshold=1048576

# ── Query repository ─────────────────────────────────────────────────────────
# Left as artifact-scan deliberately. It reads through whichever store is active, so it works in
# mongodb mode unchanged, and it keeps this profile a pure storage swap: if something misbehaves,
# the storage layer is the only variable. Switch to `mongo` afterwards to test the indexed query
# path as a separate step.
app.storage.repository=artifact-scan
