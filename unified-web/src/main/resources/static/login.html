<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in…</title>
    <!--
      This page used to be a dead end: a "No sign-in required" card that told an old /login
      bookmark there was nothing to sign in to. Sign-in now lives on the home page, whose login
      modal auto-starts the AWS SSO device flow and redirects to the AWS portal (see index.html,
      awsSsoAutoStartLogin). So /login forwards there rather than stranding the visitor.
    -->
    <meta http-equiv="refresh" content="0; url=/?login=1">
    <link rel="stylesheet" href="/shared/mongodb-theme.css">
    <script>window.location.replace('/?login=1');</script>
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh;
               margin:0; font-family:inherit; background:var(--bg,#111); color:var(--text,#eee); }
        .card { max-width:520px; padding:28px 32px; border:1px solid var(--border,#333);
                border-radius:8px; background:var(--bg-card,#1a1a1a); line-height:1.65; }
        h1 { margin:0 0 12px; font-size:19px; }
        p { margin:0 0 12px; font-size:13px; color:var(--text-secondary,#bbb); }
        a { color:var(--accent,#4a9); }
    </style>
</head>
<body>
<div class="card">
    <h1>Signing in…</h1>
    <p>Taking you to the AWS SSO login.</p>
    <p><a href="/?login=1">Continue to the login</a></p>
</div>
</body>
</html>
