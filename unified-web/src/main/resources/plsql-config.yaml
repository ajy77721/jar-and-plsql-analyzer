source_paths:
- "./plsql-sources"
schema_mappings: {}
file_extensions:
- ".sql"
- ".pks"
- ".pkb"
- ".prc"
- ".fnc"
- ".trg"
exclude_patterns:
- "**/test/**"
- "**/backup/**"
# Global fallback connection (legacy single-DB mode) — points at the local Oracle demo.
db_hostname: "localhost"
db_port: 1521
db_service_name: "FREEPDB1"
db_users:
- username: "analyzer"
  password: "Password123!"
  description: "Oracle Free local demo"
# ── Default multi-DB demo setup (Oracle / MySQL / DB2 / SQL Server) ──
# Seeded from inside the jar into {data}/config on first startup; edit via the UI.
projects:
- name: "OracleDemo"
  description: "Oracle Free 23ai local demo"
  db_type: "ORACLE"
  environments:
  - name: "local"
    zone: null
    connections:
    - name: "oracle-free-conn"
      username: "analyzer"
      password: "Password123!"
      hostname: "localhost"
      port: 1521
      service_name: "FREEPDB1"
      sid: null
      connection_type: "SERVICE_NAME"
      role: "DEFAULT"
      tns_alias: null
      custom_url: null
      description: null
      tested: true
      db_type: "ORACLE"
      jdbc_url: "jdbc:oracle:thin:@//localhost:1521/FREEPDB1"
      effective_port: 1521
    jdbc_url: "jdbc:oracle:thin:@//localhost:1521/FREEPDB1"
    users:
    - username: "analyzer"
      password: "Password123!"
      description: "oracle-free-conn"
