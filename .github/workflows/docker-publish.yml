# ═══════════════════════════════════════════════════════════════
# Build & publish the Unified Analyzer Docker image.
#
# Modeled on the hello-flask template's .drone.yml:
#   test step            -> "test" job (mvn test)
#   build+publish-master -> "publish" job on push to master (tags: git-<sha>, latest)
#   build+publish-tag    -> "publish" job on tag push    (tags: <version>, git-<sha>)
#   deploy (Helm/Kanopy) -> not applicable; consumers run the image with `docker run`
# ═══════════════════════════════════════════════════════════════

name: docker-publish

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── test step ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcases disabled for now — compile-only. To re-enable: mvn -B test
      - name: Build (tests skipped)
        run: mvn -B -no-transfer-progress package -DskipTests

  # ── build+publish steps ──
  publish:
    # PRs build nothing; only master pushes and version tags publish
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy mirrors hello-flask:
      #   master push -> git-<sha> + latest
      #   tag push    -> git-<sha> + <version>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
